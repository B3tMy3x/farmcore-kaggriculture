[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "kaggriculture-rs"
version = "0.1.0"
requires-python = ">=3.10"
description = "Deterministic Rust Kaggriculture simulator and parallel Python batch API"

[tool.maturin]
module-name = "kaggriculture_rs"
features = ["extension-module"]
